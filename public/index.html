            <p className="text-sm leading-relaxed">
              {isRetrofit
                ? 'This profile documents an agent already deployed. Items marked Missing or Partial in production form the Gap Register and must be remediated within the horizon below.'
                : 'This profile is a structured draft produced by you using the Governed by Design framework. It must be reviewed and signed by the Compliance Owner before serving as evidence under Article 26.'}
            </p>
          </div>

          {agent.highRiskFlag === 'unclear' && (
            <div className="paper-edge p-4 mb-10 no-print" style={{background: 'var(--gap-soft)', borderColor: 'var(--gap)'}}>
              <div className="mono text-[10px] tracking-widest mb-1" style={{color: 'var(--gap)'}}>CLASSIFICATION UNRESOLVED — DO NOT SHARE EXTERNALLY</div>
              <p className="text-sm leading-relaxed">Annex III classification is marked unclear. This profile must not be shared externally or filed as a compliance record until the written classification rationale is confirmed and entered in §1.</p>
            </div>
          )}

          {maturity && (
            <section className="mb-12">
              <div className="doc-h3 mb-3">§0 · Maturity Position</div>
              <div className="flex items-baseline gap-3 mb-3 flex-wrap">
                <h2 className="doc-h2">
                  {maturity.score === 'green' && 'Structurally ready.'}
                  {maturity.score === 'yellow' && 'Partial readiness.'}
                  {maturity.score === 'red' && 'Significant structural gap.'}
                </h2>
                <Pill tone={maturity.score === 'green' ? 'complete' : maturity.score === 'red' ? 'gap' : 'accent'}>{maturity.score.toUpperCase()}</Pill>
              </div>
              <p className="text-sm text-[var(--muted)] mb-2">Weakest primitives:</p>
              <ul className="text-sm space-y-0.5">{maturity.weakest.map(p => <li key={p}>· {p}</li>)}</ul>
            </section>
          )}

          <div className="rule mb-12"></div>

          {/* §1 Agent Definition */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§1 · Agent Definition</div>
            <h2 className="doc-h2 mb-4">Identity, scope, and classification</h2>
            <ObligationTag>ART. 26(3) — USE PER INSTRUCTIONS</ObligationTag><ObligationTag>ANNEX IV §1</ObligationTag>
            <dl className="mt-6 space-y-4 text-sm">
              <DefRow term="Function" desc={agent.purpose} />
              {agent.purposeDetail && <DefRow term="Intended purpose" desc={agent.purposeDetail} />}
              <DefRow term="Annex III domains" desc={agent.domain.length ? agent.domain.map(d => ANNEX_III.find(c => c.id === d)?.label).join(' · ') : 'None selected'} />
              <DefRow term="Classification" desc={agent.highRiskFlag === 'yes' ? 'High-risk AI system' : agent.highRiskFlag === 'no' ? 'Not high-risk' : 'Unclear — pending review'} />
              {agent.systems && <DefRow term="Systems & data touched" desc={agent.systems} />}
              <DefRow term="Autonomy level" desc={AUTONOMY_LEVELS.find(a => a.id === agent.autonomy)?.label || '—'} />
              <DefRow term="Deployment status" desc={`${DEPLOYMENT_MODES.find(m => m.id === agent.deploymentStatus)?.label} · ${horizonLabel}`} />
              <DefRow term="Role" desc="Deployer (EU AI Act, Article 26)" />
            </dl>
          </section>

          <div className="rule mb-12"></div>

          {/* §2 Boundary */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§2 · Decision Boundary Contract</div>
            <h2 className="doc-h2 mb-4">What the agent may do</h2>
            <ObligationTag>ART. 26(1) — USE PER INSTRUCTIONS</ObligationTag>
            <div className="mt-6 space-y-6 text-sm">
              <BoundaryList title="ALLOWED" items={boundary.allowed} showStatus={isRetrofit} />
              <BoundaryList title="PROHIBITED" items={boundary.prohibited} showStatus={isRetrofit} />
              {boundary.conditional.length > 0 && (
                <div>
                  <div className="mono text-xs text-[var(--muted)] mb-2 tracking-wider">CONDITIONAL</div>
                  <div className="space-y-2">
                    {boundary.conditional.map((c, i) => (
                      <div key={i} className="paper-edge p-3">
                        <div className="flex items-start justify-between gap-3">
                          <div className="flex-1">
                            <div className="font-medium">{c.action}</div>
                            <div className="text-xs text-[var(--muted)] mt-1"><em>When:</em> {c.trigger}</div>
                          </div>
                          {isRetrofit && c.status && <StatusPill status={c.status} />}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </section>

          <div className="rule mb-12"></div>

          {/* §3 Oversight */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§3 · Oversight Trigger Matrix</div>
            <h2 className="doc-h2 mb-4">Where a human enters</h2>
            <ObligationTag>ART. 14 — HUMAN OVERSIGHT</ObligationTag><ObligationTag>ART. 26(2)</ObligationTag>
            <div className="mt-6 overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left mono text-[10px] tracking-widest text-[var(--muted)]">
                    <th className="pb-2 pr-4 font-normal">#</th>
                    <th className="pb-2 pr-4 font-normal">ACTION</th>
                    <th className="pb-2 pr-4 font-normal">LEVEL</th>
                    <th className="pb-2 pr-4 font-normal">TRIGGER</th>
                    {isRetrofit && <th className="pb-2 font-normal">STATUS</th>}
                  </tr>
                </thead>
                <tbody>
                  {oversight.map((r, i) => (
                    <tr key={i} className="border-t border-[var(--border)]">
                      <td className="py-3 pr-4 mono text-xs text-[var(--muted)] align-top">{String(i+1).padStart(2,'0')}</td>
                      <td className="py-3 pr-4 align-top">{r.action}</td>
                      <td className="py-3 pr-4 align-top mono text-xs uppercase">{r.level}</td>
                      <td className="py-3 pr-4 align-top text-[var(--muted)] italic">{r.trigger || '—'}</td>
                      {isRetrofit && <td className="py-3 align-top"><StatusPill status={r.status} /></td>}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>

          <div className="rule mb-12"></div>

          {/* §4 Accountability */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§4 · Accountability Canvas</div>
            <h2 className="doc-h2 mb-4">Four named owners</h2>
            <ObligationTag>ART. 26(2) — HUMAN OVERSIGHT ASSIGNMENT</ObligationTag>
            <div className="grid grid-cols-2 gap-x-8 gap-y-6 mt-6 text-sm">
              {[['Decision Owner', accountability.decision], ['Oversight Owner', accountability.oversight], ['Technical Owner', accountability.technical], ['Compliance Owner', accountability.compliance]].map(([label, o]) => (
                <div key={label}>
                  <div className="flex items-baseline justify-between mb-1">
                    <div className="mono text-[10px] text-[var(--muted)] tracking-widest">{label.toUpperCase()}</div>
                    {isRetrofit && <StatusPill status={o.status} />}
                  </div>
                  <div className="font-medium">{o.name || '⚠ MISSING'}</div>
                  <div className="text-[var(--muted)] text-xs">{o.title || '—'}</div>
                </div>
              ))}
            </div>
          </section>

          <div className="rule mb-12"></div>

          {/* §5 Audit */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§5 · Audit Schema</div>
            <h2 className="doc-h2 mb-4">Handoff Receipt structure</h2>
            <ObligationTag>ART. 12 — RECORD-KEEPING</ObligationTag><ObligationTag>ART. 26(6) — LOG RETENTION</ObligationTag>
            <div className="mt-6 text-sm space-y-4">
              <div>
                <div className="mono text-xs text-[var(--muted)] tracking-wider mb-2">RECEIPT FIELDS ({audit.fields.length})</div>
                <div className="flex flex-wrap gap-1.5">
                  {audit.fields.map(f => (
                    <span key={f} className="mono text-xs px-2 py-1 inline-flex items-center gap-1" style={{background: 'var(--accent-soft)', color: 'var(--accent)'}}>
                      {f}
                      {isRetrofit && audit.fieldStatus?.[f] && <StatusPill status={audit.fieldStatus[f]} />}
                    </span>
                  ))}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-6">
                <div><div className="mono text-xs text-[var(--muted)] tracking-wider mb-1">RETENTION</div><div>{audit.retentionMonths} months</div></div>
                <div><div className="mono text-xs text-[var(--muted)] tracking-wider mb-1">FORMAT</div><div>{audit.receiptStructure || '—'}</div></div>
              </div>
            </div>
          </section>

          <div className="rule mb-12 print-page-break"></div>

          {/* §6 Sequence */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§6 · {isRetrofit ? 'Remediation Sequence' : 'Implementation Sequence'}</div>
            <h2 className="doc-h2 mb-4">{isRetrofit ? `${horizonLabel} gap-closure plan` : `${horizonLabel} deployment path`}</h2>
            <p className="text-sm text-[var(--muted)] italic mb-6 leading-relaxed">
              {isRetrofit
                ? 'Prioritized by exposure. P1 items are the most urgent; high-risk classification accelerates all P1 timelines.'
                : `Auto-assembled from your inputs and maturity diagnostic. Calibrated to a ${horizonLabel} horizon. Adjust week numbering to your own deployment calendar.`}
            </p>
            <div className="space-y-6">
              {sequence.map((phase, idx) => (
                <div key={idx} className="grid grid-cols-[100px_1fr] gap-4">
                  <div>
                    <div className="mono text-xs text-[var(--muted)] tracking-widest">{isRetrofit ? 'WINDOW' : 'TIMING'}</div>
                    <div className="display text-xl leading-tight">{phase.unit}</div>
                  </div>
                  <div>
                    <h4 className="font-medium text-base mb-2">{phase.title}</h4>
                    <ul className="text-sm space-y-1.5 text-[var(--muted)]">
                      {phase.items.map((item, i) => (
                        <li key={i} className="leading-relaxed"><span className="mono text-xs text-[var(--border-strong)] mr-2">·</span>{item}</li>
                      ))}
                    </ul>
                  </div>
                </div>
              ))}
            </div>
          </section>

          <div className="rule mb-12"></div>

          {/* §7 Gaps */}
          <section className="mb-12">
            <div className="doc-h3 mb-3">§7 · Gap Register</div>
            <h2 className="doc-h2 mb-4">{gaps.length} gap{gaps.length === 1 ? '' : 's'} surfaced</h2>
            <p className="text-sm text-[var(--muted)] italic mb-6 leading-relaxed">
              Inputs skipped, defaults inferred, items marked missing or partial in production. Export this as CSV for your issue tracker.
            </p>
            {gaps.length === 0 ? (
              <p className="text-sm">No gaps identified.</p>
            ) : (
              <div className="space-y-2">
                {gaps.map((g, i) => (
                  <div key={i} className="paper-edge p-4">
                    <div className="flex items-baseline gap-2 mb-1 flex-wrap">
                      <span className="mono text-[10px] text-[var(--muted)] tracking-widest">GAP-{String(i+1).padStart(3,'0')}</span>
                      <Pill tone={g.severity === 'P1' ? 'gap' : g.severity === 'P2' ? 'accent' : 'muted'}>{g.severity}</Pill>
                      <span className="mono text-[10px] text-[var(--muted)]">{g.area.toUpperCase()}</span>
                      <ObligationTag>{g.obligation}</ObligationTag>
                      <span className="mono text-[10px] text-[var(--muted)] ml-auto">{g.targetDays}d</span>
                    </div>
                    <p className="text-sm leading-relaxed">{g.description}</p>
                    <p className="text-xs text-[var(--muted)] mt-1 italic">Suggested owner: {g.owner}</p>
                  </div>
                ))}
              </div>
            )}
          </section>

          <div className="rule mb-12"></div>

          {/* §8 Lineage */}
          <section className="mb-4">
            <div className="doc-h3 mb-3">§8 · Replaces vs. Drafts</div>
            <p className="text-sm leading-relaxed mb-4">
              This profile <strong>replaces</strong> the deployer's classification rationale note (§1), the human oversight assignment record (§4), the boundary documentation (§2), and the calibrated oversight protocol (§3). It <strong>drafts</strong> the audit schema (§5) and {isRetrofit ? 'remediation' : 'implementation'} sequence (§6), which the Technical and Compliance Owners must verify against the deployed system.
            </p>
            <p className="text-sm leading-relaxed text-[var(--muted)] italic">
              Provider-supplied facts (model cards, conformity assessments, technical documentation under Articles 9–15) are <em>not</em> covered by this profile and must be retained separately under Article 26(4).
            </p>
          </section>

          <div className="rule-ink mt-16 pt-6 flex justify-between items-baseline text-xs text-[var(--muted)]">
            <span className="mono tracking-widest">GOVERNED BY DESIGN · AISTREAMLINEHUB.COM</span>
            <span className="mono tracking-widest">AGPB v1.1</span>
          </div>
        </article>

        <p className="text-xs text-[var(--muted)] italic mt-6 text-center max-w-xl mx-auto leading-relaxed no-print">
          To save unlimited agents, version this profile, export the machine-readable JSON, track remediation closure, and use AI-assisted drafting — upgrade to the paid Agent Register. <em>Coming soon.</em>
        </p>
      </div>
    </div>
  );
}

// ============================================================================
// PROFILE HELPERS
// ============================================================================
function DefRow({ term, desc }) {
  return (
    <div className="grid grid-cols-[180px_1fr] gap-4 items-baseline">
      <dt className="mono text-xs text-[var(--muted)] tracking-widest">{term.toUpperCase()}</dt>
      <dd className="leading-relaxed">{desc}</dd>
    </div>
  );
}

function BoundaryList({ title, items, showStatus }) {
  return (
    <div>
      <div className="mono text-xs text-[var(--muted)] mb-2 tracking-wider">{title} ({items.length})</div>
      <ul className="space-y-1.5">
        {items.map((a, i) => (
          <li key={i} className="flex gap-3 items-center">
            <span className="mono text-xs text-[var(--border-strong)] mt-0.5">{String(i+1).padStart(2,'0')}</span>
            <span className="flex-1">{a.text || a}</span>
            {showStatus && a.status && <StatusPill status={a.status} />}
          </li>
        ))}
      </ul>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
