<style>
  :root {
    --paper: #FAF7F2; --surface: #FFFFFF; --ink: #1A1A1A; --muted: #6B6760;
    --border: #E5E1D9; --border-strong: #C9C2B5;
    --accent: #B8862F; --accent-soft: #F3EAD3;
    --gap: #8B4A3E; --gap-soft: #F1E1DC;
    --complete: #4A5D3A; --complete-soft: #E3E8DC;
  }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); font-weight: 400; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .paper-edge { border: 1px solid var(--border); background: var(--surface); }
  .field-input { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 0.625rem 0.875rem; color: var(--ink); font-size: 0.9375rem; transition: border-color 120ms ease; }
  .field-input:focus { outline: none; border-color: var(--ink); }
  .field-input::placeholder { color: #B3AEA4; }
  textarea.field-input { resize: vertical; min-height: 4.5rem; line-height: 1.55; }
  .pill { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.125rem 0.5rem; font-size: 0.6875rem; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; font-family: 'IBM Plex Mono', monospace; }
  .obligation-tag { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.6875rem; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; margin-right: 0.25rem; }
  .gap-tag { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.6875rem; background: var(--gap-soft); color: var(--gap); border: 1px solid var(--gap); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }
  .complete-tag { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.6875rem; background: var(--complete-soft); color: var(--complete); border: 1px solid var(--complete); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }
  .status-pill { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; font-size: 0.625rem; letter-spacing: 0.04em; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; border: 1px solid; }
  .status-in-place { color: var(--complete); background: var(--complete-soft); border-color: var(--complete); }
  .status-partial { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .status-missing { color: var(--gap); background: var(--gap-soft); border-color: var(--gap); }
  .rule { border-top: 1px solid var(--border); }
  .rule-ink { border-top: 1px solid var(--ink); }
  .btn-primary { background: var(--ink); color: var(--paper); padding: 0.625rem 1.25rem; font-size: 0.875rem; letter-spacing: 0.02em; transition: background 120ms ease; border: 1px solid var(--ink); }
