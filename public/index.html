<style>
  :root {
    --paper: #FAF7F2; --surface: #FFFFFF; --ink: #1A1A1A; --muted: #6B6760;
    --border: #E5E1D9; --border-strong: #C9C2B5;
    --accent: #B8862F; --accent-soft: #F3EAD3;
    --gap: #8B4A3E; --gap-soft: #F1E1DC;
    --complete: #4A5D3A; --complete-soft: #E3E8DC;
  }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); font-weight: 400; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .paper-edge { border: 1px solid var(--border); background: var(--surface); }
  .field-input { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 0.625rem 0.875rem; color: var(--ink); font-size: 0.9375rem; transition: border-color 120ms ease; }
  .field-input:focus { outline: none; border-color: var(--ink); }
  .field-input::placeholder { color: #B3AEA4; }
  textarea.field-input { resize: vertical; min-height: 4.5rem; line-height: 1.55; }
  .pill { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.125rem 0.5rem; font-size: 0.6875rem; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; font-family: 'IBM Plex Mono', monospace; }
  .obligation-tag { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.6875rem; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; margin-right: 0.25rem; }
  .gap-tag { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.6875rem; background: var(--gap-soft); color: var(--gap); border: 1px solid var(--gap); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }
  .complete-tag { display: inline-block; padding: 0.125rem 0.5rem; font-size: 0.6875rem; background: var(--complete-soft); color: var(--complete); border: 1px solid var(--complete); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }
  .status-pill { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; font-size: 0.625rem; letter-spacing: 0.04em; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; border: 1px solid; }
  .status-in-place { color: var(--complete); background: var(--complete-soft); border-color: var(--complete); }
  .status-partial { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .status-missing { color: var(--gap); background: var(--gap-soft); border-color: var(--gap); }
  .rule { border-top: 1px solid var(--border); }
  .rule-ink { border-top: 1px solid var(--ink); }
  .btn-primary { background: var(--ink); color: var(--paper); padding: 0.625rem 1.25rem; font-size: 0.875rem; letter-spacing: 0.02em; transition: background 120ms ease; border: 1px solid var(--ink); }
  .btn-primary:hover { background: #2C2C2C; }
  .btn-primary:disabled { background: #9C9890; border-color: #9C9890; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink); padding: 0.625rem 1.25rem; font-size: 0.875rem; border: 1px solid var(--border-strong); transition: border-color 120ms ease; }
  .btn-ghost:hover { border-color: var(--ink); }
  .card-hover { transition: border-color 160ms ease; }
  .card-hover:hover { border-color: var(--ink); }
  .marker-num { font-family: 'IBM Plex Mono', monospace; font-size: 0.6875rem; letter-spacing: 0.08em; color: var(--muted); }
  .doc-h1 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; line-height: 1.1; letter-spacing: -0.01em; }
  .doc-h2 { font-family: 'Instrument Serif', serif; font-size: 1.625rem; line-height: 1.2; }
  .doc-h3 { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .checkitem { display: flex; align-items: flex-start; gap: 0.625rem; padding: 0.5rem 0.75rem; border: 1px solid var(--border); cursor: pointer; transition: background 120ms ease; font-size: 0.875rem; }
  .checkitem:hover { background: var(--accent-soft); }
  .checkitem.checked { background: var(--accent-soft); border-color: var(--accent); }
  .progress-rail { height: 1px; background: var(--border); width: 100%; position: relative; }
  .progress-fill { height: 1px; background: var(--ink); position: absolute; top: 0; left: 0; transition: width 240ms ease; }
  .scrollbar-clean::-webkit-scrollbar { width: 8px; }
  .scrollbar-clean::-webkit-scrollbar-thumb { background: var(--border-strong); }
  @media print {
    .no-print { display: none !important; }
    body { background: #FAF7F2 !important; color: #1A1A1A !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .paper-edge { border: 1px solid #E5E1D9 !important; background: #FFFFFF !important; }
    .print-page-break { page-break-before: always; }
    .obligation-tag { background: #F3EAD3 !important; color: #B8862F !important; border-color: #B8862F !important; }
    .gap-tag { background: #F1E1DC !important; color: #8B4A3E !important; border-color: #8B4A3E !important; }
    .complete-tag { background: #E3E8DC !important; color: #4A5D3A !important; border-color: #4A5D3A !important; }
    .status-in-place { background: #E3E8DC !important; color: #4A5D3A !important; border-color: #4A5D3A !important; }
    .status-partial { background: #F3EAD3 !important; color: #B8862F !important; border-color: #B8862F !important; }
    .status-missing { background: #F1E1DC !important; color: #8B4A3E !important; border-color: #8B4A3E !important; }
    .rule { border-top: 1px solid #E5E1D9 !important; }
    .rule-ink { border-top: 1px solid #1A1A1A !important; }
  }
  .fade-in { animation: fadeIn 280ms ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, Fragment } = React;

// ============================================================================
// CONSTANTS
// ============================================================================

const ANNEX_III = [
  { id: 'biometrics', label: 'Biometrics & emotion recognition' },
  { id: 'critical_infra', label: 'Critical infrastructure' },
  { id: 'education', label: 'Education & vocational training' },
  { id: 'employment', label: 'Employment & worker management' },
  { id: 'essential_services', label: 'Essential services (credit, benefits, insurance)' },
  { id: 'law_enforcement', label: 'Law enforcement' },
  { id: 'migration', label: 'Migration, asylum & border control' },
  { id: 'justice', label: 'Administration of justice & democratic processes' },
];

const AUTONOMY_LEVELS = [
  { id: 'autonomous', label: 'Autonomous', detail: 'Acts without human entry.' },
  { id: 'notify', label: 'Notify', detail: 'Acts, then notifies a named human.' },
  { id: 'approve', label: 'Approve', detail: 'Waits for approval before acting.' },
  { id: 'controlled', label: 'Controlled', detail: 'Human drives; agent suggests.' },
];

const DEPLOYMENT_MODES = [
  { id: 'pre', label: 'Pre-deployment', detail: 'Building from scratch. Greenfield governance design.' },
  { id: 'inflight', label: 'In-flight build', detail: 'Build underway. Some decisions already made.' },
  { id: 'retrofit', label: 'Already deployed', detail: 'Live in production. Documenting backwards.' },
];

const HORIZON_OPTIONS_PRE = [
  { id: '2', label: '2 weeks', detail: 'Pre-Aug rush' },
  { id: '4', label: '4 weeks', detail: 'Compressed' },
  { id: '8', label: '8 weeks', detail: 'Standard' },
  { id: '12', label: '12 weeks', detail: 'Full sequence' },
  { id: '24', label: '24 weeks', detail: 'Extended programme' },
];

const HORIZON_OPTIONS_RETROFIT = [
  { id: '30', label: '30 days', detail: 'Imminent audit' },
  { id: '60', label: '60 days', detail: 'Near-term remediation' },
  { id: '90', label: '90 days', detail: 'Standard remediation' },
  { id: '180', label: '6 months', detail: 'Phased programme' },
];

const STATUS_OPTIONS = [
  { id: 'in_place', label: 'In place', tone: 'in-place' },
  { id: 'partial', label: 'Partial', tone: 'partial' },
  { id: 'missing', label: 'Missing', tone: 'missing' },
];

const MATURITY_QUESTIONS = [
  { id: 'q1', text: 'A written classification rationale exists for this agent (is it Annex III high-risk, and on what basis).' },
  { id: 'q2', text: 'Decision boundaries are recorded as a contract — not as a capability statement.' },
  { id: 'q3', text: 'Human oversight points are named individuals with defined entry conditions, not implicit fallbacks.' },
  { id: 'q4', text: 'Logging captures structured fields a regulator could query — not reconstructed narratives.' },
  { id: 'q5', text: 'A pre-deployment owner is named for: decision, oversight, technical, compliance.' },
];

const MATURITY_TO_PRIMITIVE = { q1: 'Agent Definition', q2: 'Decision Boundary Contract', q3: 'Oversight Trigger Matrix', q4: 'Audit Schema', q5: 'Accountability Canvas' };

// ============================================================================
// PRIMITIVE UI COMPONENTS
// ============================================================================

const Pill = ({ tone = 'muted', children }) => {
  const map = { muted: {color: '#6B6760'}, ink: {color: '#1A1A1A'}, accent: {color: '#B8862F'}, gap: {color: '#8B4A3E'}, complete: {color: '#4A5D3A'} };
  return <span className="pill" style={map[tone]}>{children}</span>;
};

const StatusPill = ({ status }) => {
  if (!status) return null;
  const opt = STATUS_OPTIONS.find(o => o.id === status);
  if (!opt) return null;
  return <span className={`status-pill status-${opt.tone}`}>{opt.id === 'in_place' ? '●' : opt.id === 'partial' ? '◐' : '○'} {opt.label}</span>;
};

const ObligationTag = ({ children }) => <span className="obligation-tag">{children}</span>;
const GapTag = ({ children }) => <span className="gap-tag">{children}</span>;
const CompleteTag = ({ children }) => <span className="complete-tag">{children}</span>;

const Field = ({ label, hint, required, children }) => (
  <div className="space-y-1.5">
    <label className="flex items-baseline gap-2">
      <span className="text-xs uppercase tracking-wider text-[var(--muted)]" style={{letterSpacing: '0.1em'}}>{label}</span>
      {required && <span className="text-[10px] mono" style={{color: 'var(--gap)'}}>REQUIRED</span>}
    </label>
    {children}
    {hint && <p className="text-xs text-[var(--muted)] italic leading-relaxed">{hint}</p>}
  </div>
);

const StatusSelector = ({ value, onChange, compact = false }) => (
  <div className={`grid grid-cols-3 gap-1 ${compact ? 'max-w-xs' : ''}`}>
    {STATUS_OPTIONS.map(o => (
      <button key={o.id} type="button" onClick={() => onChange(o.id)}
        className={`p-1.5 text-[10px] mono uppercase border transition-colors ${
          value === o.id ? `status-${o.tone}` : 'border-[var(--border-strong)] text-[var(--muted)] hover:border-[var(--ink)]'
        }`}>{o.label}</button>
    ))}
  </div>
);

// ============================================================================
// MAIN APP
// ============================================================================

function App() {
  const [stage, setStage] = useState('welcome');
  const [openCard, setOpenCard] = useState(null);
  const [email, setEmail] = useState('');

  const [agent, setAgent] = useState({
    name: '', purpose: '', purposeDetail: '', domain: [], systems: '',
    autonomy: '', highRiskFlag: null,
    deploymentStatus: '', horizon: '',
  });

  const [maturity, setMaturity] = useState(null);
  const [boundary, setBoundary] = useState({ allowed: [], prohibited: [], conditional: [] });
  const [oversight, setOversight] = useState([]);
  const [accountability, setAccountability] = useState({
    decision: { name: '', title: '', status: '' },
    oversight: { name: '', title: '', status: '' },
    technical: { name: '', title: '', status: '' },
    compliance: { name: '', title: '', status: '' },
  });
  const [audit, setAudit] = useState({ fields: [], fieldStatus: {}, retentionMonths: 6, receiptStructure: '' });

  const isRetrofit = agent.deploymentStatus === 'retrofit';

  const completion = useMemo(() => ({
    agent: !!(agent.name && agent.purpose && agent.autonomy && agent.highRiskFlag && agent.deploymentStatus && agent.horizon),
    maturity: maturity !== null,
    boundary: boundary.allowed.length >= 1 && boundary.prohibited.length >= 1,
    oversight: oversight.length >= 1,
    accountability: !!(accountability.decision.name && accountability.oversight.name && accountability.technical.name && accountability.compliance.name),
    audit: audit.fields.length >= 1,
  }), [agent, maturity, boundary, oversight, accountability, audit]);

  const requiredComplete = completion.agent && completion.boundary && completion.oversight && completion.accountability && completion.audit;
  const completedCount = [completion.boundary, completion.oversight, completion.accountability, completion.audit].filter(Boolean).length;

  // ==========================================================================
  // WELCOME
  // ==========================================================================
  if (stage === 'welcome') return (
    <div className="min-h-screen flex items-center justify-center p-8 fade-in">
      <div className="max-w-2xl w-full">
        <div className="mono text-xs tracking-widest text-[var(--muted)] mb-6">AGENTIC GOVERNANCE PROFILE BUILDER / v1.1</div>
        <h1 className="display text-5xl md:text-6xl leading-[1.05] mb-6">
          Produce a regulator-defensible<br/>
          governance profile for <em className="display italic">one</em> AI agent.
        </h1>
        <p className="text-[var(--muted)] text-lg leading-relaxed mb-2 max-w-xl">Five primitives. One agent. EU AI Act deployer obligations.</p>
        <p className="text-[var(--muted)] leading-relaxed mb-10 max-w-xl">
          Works for agents you're building <em>and</em> agents already running in production. Choose your deployment status to shape the workspace.
        </p>
        <div className="rule-ink mb-8"></div>
        <div className="grid md:grid-cols-3 gap-6 mb-10 text-sm">
          <div>
            <div className="marker-num mb-2">01</div>
            <div className="text-[var(--ink)] mb-1">Three modes</div>
            <div className="text-[var(--muted)] text-xs leading-relaxed">Pre-deployment, in-flight build, or retrofit on a deployed agent.</div>
          </div>
          <div>
            <div className="marker-num mb-2">02</div>
            <div className="text-[var(--ink)] mb-1">Lineage, not language</div>
            <div className="text-[var(--muted)] text-xs leading-relaxed">Every field traces to an input and names the obligation it serves.</div>
          </div>
          <div>
            <div className="marker-num mb-2">03</div>
            <div className="text-[var(--ink)] mb-1">Two artifacts</div>
            <div className="text-[var(--muted)] text-xs leading-relaxed">Governance Profile for the regulator. Gap Register for the team.</div>
          </div>
        </div>
        <div className="flex gap-3 flex-wrap">
          <button className="btn-primary" onClick={() => setStage('agentDef')}>Begin →</button>
          <button className="btn-ghost" onClick={() => {
            setAgent({
              name: 'Sanctions Triage Agent',
              purpose: 'Screens inbound payments against EU and UK sanctions lists and flags potential matches for compliance review.',
              purposeDetail: 'Deployed by a payment institution to pre-screen SEPA and SWIFT transactions before processing. The agent reads payment metadata, queries three sanctions databases, and routes flagged transactions to a named compliance reviewer. It does not block payments autonomously — it escalates.',
              domain: ['essential_services'],
              systems: 'Core payments platform (read)\nSanctions database API — EU/UK lists (read)\nCompliance case queue (write)\nTransaction log (read)',
              autonomy: 'notify',
              highRiskFlag: 'yes',
              deploymentStatus: 'retrofit',
              horizon: '90',
            });
            setBoundary({
              allowed: [
                { text: 'Read transaction metadata from payments platform', status: 'in_place' },
                { text: 'Query EU Consolidated Sanctions List', status: 'in_place' },
                { text: 'Query UK HM Treasury Sanctions List', status: 'in_place' },
                { text: 'Write flagged transaction to compliance case queue', status: 'partial' },
                { text: 'Notify named compliance reviewer via internal alert', status: 'in_place' },
              ],
              prohibited: [
                { text: 'Block or reverse a payment autonomously', status: 'in_place' },
                { text: 'Access customer account balances or history', status: 'in_place' },
                { text: 'Modify transaction records', status: 'in_place' },
                { text: 'Communicate with external parties', status: 'in_place' },
              ],
              conditional: [
                { action: 'Escalate to Head of Compliance', trigger: 'Match confidence score > 0.9 AND transaction value > €50,000', status: 'missing' },
              ],
            });
            setOversight([
              { action: 'Write flagged transaction to compliance case queue', level: 'approve', trigger: 'Compliance reviewer must confirm before case is filed', status: 'partial' },
              { action: 'Escalate to Head of Compliance', level: 'approve', trigger: 'Match confidence > 0.9 AND value > €50,000', status: 'missing' },
              { action: 'Notify named compliance reviewer via internal alert', level: 'notify', trigger: 'Any sanctions match at any confidence level', status: 'in_place' },
            ]);
            setAccountability({
              decision: { name: 'Sarah Müller', title: 'Head of Financial Crime Compliance', status: 'in_place' },
              oversight: { name: 'Thomas Becker', title: 'Senior Compliance Analyst', status: 'partial' },
              technical: { name: 'Lena Fischer', title: 'AI Platform Lead', status: 'in_place' },
              compliance: { name: 'Sarah Müller', title: 'Head of Financial Crime Compliance', status: 'in_place' },
            });
            setAudit({
              fields: ['Transaction ID', 'Agent version', 'Sanctions list queried', 'Match confidence score', 'Escalation trigger condition', 'Reviewing officer ID', 'Decision timestamp', 'Override flag'],
              fieldStatus: {
                'Transaction ID': 'in_place',
                'Agent version': 'missing',
                'Sanctions list queried': 'in_place',
                'Match confidence score': 'partial',
                'Escalation trigger condition': 'missing',
                'Reviewing officer ID': 'partial',
                'Decision timestamp': 'in_place',
                'Override flag': 'missing',
              },
              retentionMonths: 24,
              receiptStructure: 'JSON event written to immutable audit log at each state transition',
            });
            setStage('dashboard');
          }}>Load example →</button>
        </div>
        <div className="mt-12 flex items-center justify-between flex-wrap gap-4">
          <div className="mono text-[10px] text-[var(--muted)] tracking-widest">GOVERNED BY DESIGN · EDITION 1–6 · AISTREAMLINEHUB.COM</div>
          <a href="https://www.aistreamlinehub.com" className="mono text-[10px] text-[var(--muted)] tracking-widest hover:text-[var(--ink)] transition-colors">← AISTREAMLINEHUB.COM</a>
        </div>
      </div>
    </div>
  );

  // ==========================================================================
  // AGENT DEFINITION
  // ==========================================================================
  if (stage === 'agentDef') {
    const canProceed = agent.name && agent.purpose && agent.autonomy && agent.highRiskFlag && agent.deploymentStatus && agent.horizon;
    const horizonOptions = agent.deploymentStatus === 'retrofit' ? HORIZON_OPTIONS_RETROFIT : HORIZON_OPTIONS_PRE;

    return (
      <div className="min-h-screen p-6 md:p-10 fade-in">
        <div className="max-w-3xl mx-auto">
          <Header step="Screen 1" title="Agent Definition" progressLabel="Step 1 of 2" progress={0.5} />

          <div className="paper-edge p-8 md:p-12 mt-8 space-y-8">
            <div>
              <div className="marker-num mb-2">A · IDENTITY</div>
              <h2 className="display text-3xl mb-1">Name and purpose</h2>
              <p className="text-sm text-[var(--muted)] mb-6 italic">Classification rationale starts here. A vague purpose produces an indefensible record.</p>
              <div className="space-y-5">
                <Field label="Agent name" required>
                  <input className="field-input" placeholder="e.g. Sanctions Triage Agent" value={agent.name} onChange={e => setAgent({...agent, name: e.target.value})} />
                </Field>
                <Field label="One-line function" required>
                  <input className="field-input" placeholder="e.g. Screens inbound payments against sanctions lists and flags matches for compliance review." value={agent.purpose} onChange={e => setAgent({...agent, purpose: e.target.value})} />
                </Field>
                <Field label="Intended purpose (long form)" hint="Used as the basis for Annex III classification. Be specific about the decision the agent informs or makes.">
                  <textarea className="field-input" rows={3} placeholder="Describe the deployment context, the decision being supported, and who the output affects." value={agent.purposeDetail} onChange={e => setAgent({...agent, purposeDetail: e.target.value})} />
                </Field>
              </div>
            </div>

            <div className="rule"></div>

            <div>
              <div className="marker-num mb-2">B · ANNEX III CLASSIFICATION</div>
              <h2 className="display text-3xl mb-1">Is this a high-risk AI system?</h2>
              <p className="text-sm text-[var(--muted)] mb-6 italic">Select every Annex III category the agent touches. "It is just a chatbot" is not a legal analysis.</p>
              <div className="grid md:grid-cols-2 gap-2">
                {ANNEX_III.map(cat => (
                  <div key={cat.id} className={`checkitem ${agent.domain.includes(cat.id) ? 'checked' : ''}`}
                    onClick={() => {
                      const next = agent.domain.includes(cat.id) ? agent.domain.filter(d => d !== cat.id) : [...agent.domain, cat.id];
                      setAgent({...agent, domain: next});
                    }}>
                    <span className="mono text-xs mt-0.5" style={{color: agent.domain.includes(cat.id) ? 'var(--accent)' : 'var(--muted)'}}>
                      {agent.domain.includes(cat.id) ? '■' : '□'}
                    </span>
                    <span>{cat.label}</span>
                  </div>
                ))}
              </div>
              <div className="mt-6 space-y-3">
                <Field label="Your written classification" required>
                  <div className="grid grid-cols-3 gap-2">
                    {[{v:'yes',l:'High-risk'},{v:'no',l:'Not high-risk'},{v:'unclear',l:'Unclear / pending review'}].map(o => (
                      <button key={o.v} onClick={() => setAgent({...agent, highRiskFlag: o.v})}
                        className={`p-3 text-sm border transition-colors ${agent.highRiskFlag === o.v ? 'border-[var(--ink)] bg-[var(--ink)] text-[var(--paper)]' : 'border-[var(--border-strong)] hover:border-[var(--ink)]'}`}>
                        {o.l}
                      </button>
                    ))}
                  </div>
                </Field>
              </div>
            </div>

            <div className="rule"></div>

            <div>
              <div className="marker-num mb-2">C · SCOPE & AUTONOMY</div>
              <h2 className="display text-3xl mb-1">What it touches, how it acts</h2>
              <div className="space-y-5 mt-6">
                <Field label="Systems and data touched" hint="Source systems, datastores, downstream targets. One per line.">
                  <textarea className="field-input" rows={3} placeholder="e.g.&#10;Core banking system (read)&#10;Customer KYC store (read)&#10;Compliance case queue (write)" value={agent.systems} onChange={e => setAgent({...agent, systems: e.target.value})} />
                </Field>
                <Field label="Autonomy level" required hint="Edition 3 — Oversight Spectrum">
                  <div className="grid md:grid-cols-2 gap-2">
                    {AUTONOMY_LEVELS.map(l => (
                      <button key={l.id} onClick={() => setAgent({...agent, autonomy: l.id})}
                        className={`p-3 text-left text-sm border transition-colors ${agent.autonomy === l.id ? 'border-[var(--ink)] bg-[var(--accent-soft)]' : 'border-[var(--border-strong)] hover:border-[var(--ink)]'}`}>
                        <div className="font-medium mb-0.5">{l.label}</div>
                        <div className="text-xs text-[var(--muted)]">{l.detail}</div>
                      </button>
                    ))}
                  </div>
                </Field>
              </div>
            </div>

            <div className="rule"></div>

            <div>
              <div className="marker-num mb-2">D · DEPLOYMENT STATUS</div>
              <h2 className="display text-3xl mb-1">Where is this agent today?</h2>
              <p className="text-sm text-[var(--muted)] mb-6 italic">Shapes the workspace. Retrofit mode adds production-status flags to every primitive.</p>
              <div className="grid md:grid-cols-3 gap-2 mb-6">
                {DEPLOYMENT_MODES.map(m => (
                  <button key={m.id} onClick={() => setAgent({...agent, deploymentStatus: m.id, horizon: ''})}
                    className={`p-3 text-left text-sm border transition-colors ${agent.deploymentStatus === m.id ? 'border-[var(--ink)] bg-[var(--accent-soft)]' : 'border-[var(--border-strong)] hover:border-[var(--ink)]'}`}>
                    <div className="font-medium mb-0.5">{m.label}</div>
                    <div className="text-xs text-[var(--muted)] leading-snug">{m.detail}</div>
                  </button>
                ))}
              </div>
              {agent.deploymentStatus && (
                <Field label={agent.deploymentStatus === 'retrofit' ? 'Remediation horizon' : 'Deployment horizon'} required hint="The sequence in §6 will scale to fit this window.">
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
                    {horizonOptions.map(h => (
                      <button key={h.id} onClick={() => setAgent({...agent, horizon: h.id})}
                        className={`p-2.5 text-left border transition-colors ${agent.horizon === h.id ? 'border-[var(--ink)] bg-[var(--accent-soft)]' : 'border-[var(--border-strong)] hover:border-[var(--ink)]'}`}>
                        <div className="text-sm font-medium">{h.label}</div>
                        <div className="text-[10px] text-[var(--muted)]">{h.detail}</div>
                      </button>
                    ))}
                  </div>
                </Field>
              )}
            </div>

            <div className="rule"></div>

            <div>
              <div className="marker-num mb-2">E · ROLE LOCK</div>
              <div className="flex items-baseline gap-3 mb-2">
                <h2 className="display text-3xl">Deployer (Art. 26)</h2>
                <Pill tone="ink">v1.1 SCOPE</Pill>
              </div>
              <p className="text-sm text-[var(--muted)] italic leading-relaxed max-w-xl">
                This tool produces artifacts for the deployer role only. If you are also the provider, you will need additional documentation under Articles 9–15.
              </p>
            </div>
          </div>

          <div className="flex justify-between items-center mt-8 no-print">
            <button className="btn-ghost" onClick={() => setStage('welcome')}>← Back</button>
            <button className="btn-primary" disabled={!canProceed} onClick={() => setStage('dashboard')}>Continue to dashboard →</button>
          </div>
        </div>
      </div>
    );
  }

  // ==========================================================================
  // DASHBOARD
  // ==========================================================================
  if (stage === 'dashboard') {
    const cards = [
      { id: 'maturity', num: 'M', edition: 'Triage', title: 'Maturity Check', sub: 'Optional 90-second readiness diagnostic.', done: completion.maturity, optional: true },
      { id: 'boundary', num: 'P-01', edition: 'Edition 2', title: 'Decision Boundary Contract', sub: isRetrofit ? 'What the agent currently does — and what it should — as a contract.' : 'What the agent may do — and may not — as a contract, not a capability list.', done: completion.boundary },
      { id: 'oversight', num: 'P-02', edition: 'Edition 3', title: 'Oversight Trigger Matrix', sub: 'Where a human enters. Named, calibrated, conditional.', done: completion.oversight },
      { id: 'accountability', num: 'P-03', edition: 'Edition 4', title: 'Accountability Canvas', sub: 'Four owners — decision, oversight, technical, compliance.', done: completion.accountability },
      { id: 'audit', num: 'P-04', edition: 'Edition 5', title: 'Audit Schema', sub: 'Handoff Receipt structure. Queryable fields, retention.', done: completion.audit },
      { id: 'implementation', num: 'P-05', edition: 'Edition 6', title: isRetrofit ? 'Remediation Sequence' : 'Implementation Sequence', sub: isRetrofit ? 'Prioritized gap-closure plan — assembled from your inputs.' : 'Deployment sequence scaled to your horizon — assembled from your inputs.', done: requiredComplete, auto: true },
    ];

    const modeBadge = DEPLOYMENT_MODES.find(m => m.id === agent.deploymentStatus);
    const horizonLabel = (agent.deploymentStatus === 'retrofit' ? HORIZON_OPTIONS_RETROFIT : HORIZON_OPTIONS_PRE).find(h => h.id === agent.horizon)?.label;

    return (
      <div className="min-h-screen p-6 md:p-10 fade-in">
        <div className="max-w-4xl mx-auto">
          <Header step="Screen 2" title={isRetrofit ? 'Five Primitives — Retrofit' : 'Five Primitives'} progressLabel="Step 2 of 2" progress={1} />

          <div className="paper-edge p-6 mt-8 mb-6 flex flex-wrap gap-x-8 gap-y-3 items-baseline">
            <div>
              <div className="marker-num">AGENT</div>
              <div className="display text-2xl">{agent.name}</div>
            </div>
            <div>
              <div className="marker-num">MODE</div>
              <div className="text-sm">{modeBadge?.label} · {horizonLabel}</div>
            </div>
            <div>
              <div className="marker-num">CLASSIFICATION</div>
              <div className="text-sm">
                {agent.highRiskFlag === 'yes' && <span style={{color: 'var(--gap)'}}>High-risk</span>}
                {agent.highRiskFlag === 'no' && <span>Not high-risk</span>}
                {agent.highRiskFlag === 'unclear' && <span style={{color: 'var(--accent)'}}>Unclear · pending review</span>}
              </div>
            </div>
            <div>
              <div className="marker-num">AUTONOMY</div>
              <div className="text-sm">{AUTONOMY_LEVELS.find(a => a.id === agent.autonomy)?.label}</div>
            </div>
            <button className="ml-auto text-xs underline text-[var(--muted)] hover:text-[var(--ink)]" onClick={() => setStage('agentDef')}>Edit definition</button>
          </div>

          {isRetrofit && (
            <div className="paper-edge p-4 mb-6" style={{background: 'var(--accent-soft)', borderColor: 'var(--accent)'}}>
              <div className="mono text-[10px] tracking-widest mb-1" style={{color: 'var(--accent)'}}>RETROFIT MODE</div>
              <p className="text-sm leading-relaxed">
                For every item below, mark whether it is currently <strong>In place</strong>, <strong>Partial</strong>, or <strong>Missing</strong> in production. Items not "In place" become the Gap Register and drive the Remediation Sequence.
              </p>
            </div>
          )}

          <div className="grid md:grid-cols-2 gap-3">
            {cards.map(card => (
              <button key={card.id} onClick={() => card.id !== 'implementation' && setOpenCard(card.id)} disabled={card.id === 'implementation'}
                className={`paper-edge card-hover text-left p-6 ${card.id === 'implementation' ? 'opacity-90 cursor-default' : 'cursor-pointer'}`}>
                <div className="flex items-start justify-between mb-3">
                  <div><div className="marker-num">{card.num} · {card.edition.toUpperCase()}</div></div>
                  <div>
                    {card.done && !card.auto && <CompleteTag>● COMPLETE</CompleteTag>}
                    {card.done && card.auto && <CompleteTag>AUTO-READY</CompleteTag>}
                    {!card.done && card.optional && <Pill tone="muted">OPTIONAL</Pill>}
                    {!card.done && !card.optional && !card.auto && <Pill tone="gap">PENDING</Pill>}
                    {!card.done && card.auto && <Pill tone="muted">LOCKED</Pill>}
                  </div>
                </div>
                <h3 className="display text-2xl leading-tight mb-2">{card.title}</h3>
                <p className="text-sm text-[var(--muted)] leading-relaxed">{card.sub}</p>
                {card.auto && <p className="text-xs italic mt-3" style={{color: 'var(--accent)'}}>{card.done ? 'Will be generated when you produce your profile.' : 'Unlocks once the four primitives above are complete.'}</p>}
              </button>
            ))}
          </div>

          <div className="mt-10 paper-edge p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="marker-num mb-1">PROFILE STATUS</div>
              <div className="text-sm">{completedCount} of 4 required primitives complete.{requiredComplete && <span style={{color: 'var(--complete)'}}> · Ready to generate.</span>}</div>
              <div className="progress-rail mt-3" style={{maxWidth: '280px'}}><div className="progress-fill" style={{width: `${(completedCount / 4) * 100}%`}}></div></div>
            </div>
            <button className="btn-primary" disabled={!requiredComplete} onClick={() => setStage('emailGate')}>
              Generate {isRetrofit ? 'Remediation' : 'Governance'} Profile →
            </button>
          </div>

          <p className="text-xs text-[var(--muted)] italic mt-6 text-center max-w-xl mx-auto leading-relaxed">
            v1.1 session is not saved. Agent register, version history, machine-readable exports, AI assist — paid tier.
          </p>
        </div>

        {openCard === 'maturity' && <MaturityEditor value={maturity} onSave={v => { setMaturity(v); setOpenCard(null); }} onClose={() => setOpenCard(null)} />}
        {openCard === 'boundary' && <BoundaryEditor value={boundary} isRetrofit={isRetrofit} onSave={v => { setBoundary(v); setOpenCard(null); }} onClose={() => setOpenCard(null)} />}
        {openCard === 'oversight' && <OversightEditor value={oversight} boundary={boundary} isRetrofit={isRetrofit} onSave={v => { setOversight(v); setOpenCard(null); }} onClose={() => setOpenCard(null)} />}
        {openCard === 'accountability' && <AccountabilityEditor value={accountability} isRetrofit={isRetrofit} onSave={v => { setAccountability(v); setOpenCard(null); }} onClose={() => setOpenCard(null)} />}
        {openCard === 'audit' && <AuditEditor value={audit} isRetrofit={isRetrofit} onSave={v => { setAudit(v); setOpenCard(null); }} onClose={() => setOpenCard(null)} />}
      </div>
    );
  }

  // ==========================================================================
  // EMAIL GATE
  // ==========================================================================
  if (stage === 'emailGate') {
    return (
      <div className="min-h-screen flex items-center justify-center p-8 fade-in">
        <div className="max-w-lg w-full">
          <div className="mono text-xs tracking-widest text-[var(--muted)] mb-4">ALMOST DONE / STEP 3 OF 3</div>
          <h2 className="display text-4xl leading-tight mb-4">Your profile is ready to generate.</h2>
          <p className="text-[var(--muted)] leading-relaxed mb-8">Enter your email to view and export your {isRetrofit ? 'Remediation' : 'Governance'} Profile. We'll also send you the Automate & Elevate newsletter — one framework per week, built for regulated environments.</p>
          <Field label="Email" required>
            <input className="field-input" type="email" placeholder="name@company.com" value={email} onChange={e => setEmail(e.target.value)} />
          </Field>
          <div className="flex justify-between items-center mt-6">
            <button className="btn-ghost" onClick={() => setStage('dashboard')}>← Back to dashboard</button>
            <button className="btn-primary" disabled={!email || !email.includes('@')}
              onClick={async () => {
                try {
                  await fetch('https://formspree.io/f/mykqenpk', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                      email,
                      agent_name: agent.name,
                      mode: agent.deploymentStatus,
                    }),
                  });
                } catch (e) {
                  // Silent fail — don't block profile generation if Formspree is down
                }
                setStage('profile');
              }}>Generate Profile →</button>
          </div>
          <p className="text-xs text-[var(--muted)] italic mt-8">Your email is used to send the Automate & Elevate newsletter. Unsubscribe any time. No spam.</p>
        </div>
      </div>
    );
  }

  // ==========================================================================
  // PROFILE
  // ==========================================================================
  if (stage === 'profile') {
    return <ProfileView
      agent={agent} maturity={maturity} boundary={boundary} oversight={oversight}
      accountability={accountability} audit={audit} isRetrofit={isRetrofit}
      onBack={() => setStage('dashboard')} />;
  }

  return null;
}

    <div className="no-print">
      <div className="flex items-baseline justify-between mb-3">

        <div className="flex items-baseline gap-6">
          <a href="https://www.aistreamlinehub.com" className="mono text-xs tracking-widest text-[var(--muted)] hover:text-[var(--ink)] transition-colors">← aistreamlinehub.com</a>
          <div className="mono text-xs tracking-widest text-[var(--muted)]">{progressLabel}</div>
        </div>
      </div>
      <h1 className="display text-3xl md:text-4xl">{title}</h1>
      <div className="progress-rail mt-6"><div className="progress-fill" style={{width: `${progress * 100}%`}}></div></div>

// ============================================================================
// EDITOR SHELL
// ============================================================================
function EditorShell({ marker, title, subtitle, edition, children, onSave, onClose, saveDisabled }) {
  return (
    <div className="fixed inset-0 z-50 overflow-y-auto scrollbar-clean fade-in" style={{background: 'var(--paper)'}}>
      <div className="max-w-3xl mx-auto p-6 md:p-10 pb-32">
        <div className="flex items-baseline justify-between mb-6">
          <div className="mono text-xs tracking-widest text-[var(--muted)]">{marker} · {edition.toUpperCase()}</div>
          <button onClick={onClose} className="text-sm text-[var(--muted)] hover:text-[var(--ink)] underline">Close without saving</button>
        </div>
        <h2 className="display text-4xl md:text-5xl mb-3 leading-tight">{title}</h2>
        <p className="text-[var(--muted)] italic leading-relaxed mb-10 max-w-2xl">{subtitle}</p>
        <div className="paper-edge p-8 md:p-10">{children}</div>
      </div>
      <div className="fixed bottom-0 left-0 right-0 paper-edge border-t no-print" style={{background: 'var(--paper)'}}>
        <div className="max-w-3xl mx-auto p-4 flex justify-between items-center">
          <button onClick={onClose} className="btn-ghost">Cancel</button>
          <button onClick={onSave} disabled={saveDisabled} className="btn-primary">Save & return to dashboard →</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// MATURITY EDITOR
// ============================================================================
function MaturityEditor({ value, onSave, onClose }) {
  const [answers, setAnswers] = useState(value?.answers || { q1: null, q2: null, q3: null, q4: null, q5: null });
  const allAnswered = Object.values(answers).every(a => a !== null);
  const score = useMemo(() => {
    if (!allAnswered) return null;
    const sum = Object.values(answers).reduce((s, v) => s + v, 0);
    return sum >= 8 ? 'green' : sum >= 4 ? 'yellow' : 'red';
  }, [answers, allAnswered]);
  const weakest = useMemo(() => {
    if (!allAnswered) return [];
    return Object.entries(answers).sort((a, b) => a[1] - b[1]).slice(0, 2).map(([k]) => MATURITY_TO_PRIMITIVE[k]);
  }, [answers, allAnswered]);

  return (
    <EditorShell marker="M" edition="Edition 1 — The Governance Gap" title="Maturity Check"
      subtitle="Five questions. Where is the structural gap on this agent? Optional, but most users find it changes how they fill the rest of the workspace."
      onSave={() => onSave({ answers, score, weakest })} onClose={onClose} saveDisabled={!allAnswered}>
      <div className="space-y-7">
        {MATURITY_QUESTIONS.map((q, i) => (
          <div key={q.id}>
            <div className="flex items-start gap-3 mb-3">
              <span className="mono text-xs mt-1 text-[var(--muted)]">{String(i+1).padStart(2,'0')}</span>
              <p className="text-[15px] leading-relaxed">{q.text}</p>
            </div>
            <div className="grid grid-cols-3 gap-2 ml-8">
              {[{v:0,l:'Not in place'},{v:1,l:'Partial'},{v:2,l:'Fully in place'}].map(o => (
                <button key={o.v} onClick={() => setAnswers({...answers, [q.id]: o.v})}
                  className={`p-2.5 text-xs border transition-colors ${answers[q.id] === o.v ? 'border-[var(--ink)] bg-[var(--ink)] text-[var(--paper)]' : 'border-[var(--border-strong)] hover:border-[var(--ink)]'}`}>
                  {o.l}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
      {allAnswered && (
        <div className="mt-10 pt-8 rule">
          <div className="marker-num mb-2">PREVIEW · DIAGNOSTIC</div>
          <div className="flex items-baseline gap-3 mb-4">
            <h3 className="display text-3xl">
              {score === 'green' && 'Structurally ready.'}
              {score === 'yellow' && 'Partial readiness.'}
              {score === 'red' && 'Significant structural gap.'}
            </h3>
            <Pill tone={score === 'green' ? 'complete' : score === 'red' ? 'gap' : 'accent'}>{score?.toUpperCase()}</Pill>
          </div>
          <p className="text-sm text-[var(--muted)] mb-3">Two weakest primitives:</p>
          <ul className="text-sm space-y-1">{weakest.map(p => <li key={p}>· <span className="font-medium">{p}</span></li>)}</ul>
        </div>
      )}
    </EditorShell>
  );
}

// ============================================================================
// LIST EDITOR (extracted from BoundaryEditor to prevent remount on each keystroke)
// ============================================================================
function ListEditor({ items, setItems, placeholder, isRetrofit }) {
  return (
    <div className="space-y-2">
      {items.map((item, i) => (
        <div key={i} className="paper-edge p-3">
          <div className="flex items-center gap-2">
            <span className="mono text-xs text-[var(--muted)] w-6">{String(i+1).padStart(2,'0')}</span>
            <input className="field-input flex-1" placeholder={placeholder}
              value={item.text} onChange={e => { const next = [...items]; next[i] = {...next[i], text: e.target.value}; setItems(next); }} />
            {items.length > 1 && (
              <button onClick={() => setItems(items.filter((_, idx) => idx !== i))} className="text-[var(--muted)] hover:text-[var(--gap)] px-2 mono text-xs">×</button>
            )}
          </div>
          {isRetrofit && (
            <div className="mt-2 ml-8 flex items-center gap-3">
              <span className="text-[10px] mono uppercase text-[var(--muted)]">Production status:</span>
              <StatusSelector value={item.status} onChange={v => { const next = [...items]; next[i] = {...next[i], status: v}; setItems(next); }} />
            </div>
          )}
        </div>
      ))}
      <button onClick={() => setItems([...items, { text: '', status: '' }])} className="text-xs text-[var(--muted)] hover:text-[var(--ink)] underline mt-2">+ Add row</button>
    </div>
  );
}

// ============================================================================
// BOUNDARY EDITOR (P-01)
// ============================================================================
function BoundaryEditor({ value, isRetrofit, onSave, onClose }) {
  // Normalize: items are {text, status}
  const norm = arr => arr.length ? arr : [{ text: '', status: '' }];
  const [allowed, setAllowed] = useState(norm(value.allowed));
  const [prohibited, setProhibited] = useState(norm(value.prohibited));
  const [conditional, setConditional] = useState(value.conditional.length ? value.conditional : [{ action: '', trigger: '', status: '' }]);

  const cleanAllowed = allowed.filter(a => a.text.trim());
  const cleanProhibited = prohibited.filter(a => a.text.trim());
  const cleanConditional = conditional.filter(c => c.action.trim() && c.trigger.trim());
  const canSave = cleanAllowed.length >= 1 && cleanProhibited.length >= 1;

  return (
    <EditorShell marker="P-01" edition="Edition 2 — What Boundaries Actually Mean" title="Decision Boundary Contract"
      subtitle={isRetrofit
        ? "Define the contract that should govern this agent. For each item, mark whether it's actually enforced in production today."
        : "A capability list says what the agent can do. A boundary contract says what it may do — and under what conditions. The difference matters when something goes wrong."}
      onSave={() => onSave({ allowed: cleanAllowed, prohibited: cleanProhibited, conditional: cleanConditional })} onClose={onClose} saveDisabled={!canSave}>
      <div className="space-y-10">
        <div>
          <div className="flex items-baseline gap-2 mb-1"><h3 className="display text-2xl">Allowed actions</h3><ObligationTag>ART. 26(1)</ObligationTag></div>
          <p className="text-sm text-[var(--muted)] italic mb-4">Actions the agent may execute without conditions.</p>
          <ListEditor items={allowed} setItems={setAllowed} isRetrofit={isRetrofit} placeholder="e.g. Read transaction record from core banking" />
        </div>
        <div className="rule"></div>
        <div>
          <div className="flex items-baseline gap-2 mb-1"><h3 className="display text-2xl">Prohibited actions</h3><ObligationTag>ART. 26(1)</ObligationTag></div>
          <p className="text-sm text-[var(--muted)] italic mb-4">Actions the agent must not execute under any condition. Explicit prohibitions, not absences.</p>
          <ListEditor items={prohibited} setItems={setProhibited} isRetrofit={isRetrofit} placeholder="e.g. Modify customer account fields" />
        </div>
        <div className="rule"></div>
        <div>
          <div className="flex items-baseline gap-2 mb-1"><h3 className="display text-2xl">Conditional actions</h3><ObligationTag>ART. 26(1)</ObligationTag></div>
          <p className="text-sm text-[var(--muted)] italic mb-4">Actions permitted only when a specific condition is met. Optional.</p>
          <div className="space-y-3">
            {conditional.map((c, i) => (
              <div key={i} className="paper-edge p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="mono text-xs text-[var(--muted)] w-6">{String(i+1).padStart(2,'0')}</span>
                  <span className="mono text-[10px] text-[var(--muted)]">CONDITIONAL PAIR</span>
                  {conditional.length > 1 && <button onClick={() => setConditional(conditional.filter((_, idx) => idx !== i))} className="ml-auto text-[var(--muted)] hover:text-[var(--gap)] mono text-xs">×</button>}
                </div>
                <input className="field-input mb-2" placeholder="Action — e.g. Auto-approve transaction under €10,000"
                  value={c.action} onChange={e => { const next = [...conditional]; next[i] = {...next[i], action: e.target.value}; setConditional(next); }} />
                <input className="field-input" placeholder="Trigger — e.g. Risk score < 0.3 AND customer KYC tier ≥ 2"
                  value={c.trigger} onChange={e => { const next = [...conditional]; next[i] = {...next[i], trigger: e.target.value}; setConditional(next); }} />
                {isRetrofit && (
                  <div className="mt-3 flex items-center gap-3">
                    <span className="text-[10px] mono uppercase text-[var(--muted)]">Production status:</span>
                    <StatusSelector value={c.status} onChange={v => { const next = [...conditional]; next[i] = {...next[i], status: v}; setConditional(next); }} />
                  </div>
                )}
              </div>
            ))}
            <button onClick={() => setConditional([...conditional, { action: '', trigger: '', status: '' }])} className="text-xs text-[var(--muted)] hover:text-[var(--ink)] underline">+ Add conditional pair</button>
          </div>
        </div>
      </div>
    </EditorShell>
  );
}

// ============================================================================
// OVERSIGHT EDITOR (P-02)
// ============================================================================
function OversightEditor({ value, boundary, isRetrofit, onSave, onClose }) {
  const sourceActions = useMemo(() => [
    ...(boundary.allowed || []).map(a => ({ action: a.text || a, type: 'allowed' })),
    ...(boundary.conditional || []).map(c => ({ action: c.action, type: 'conditional' })),
  ].filter(a => a.action && a.action.trim()), [boundary]);

  const [rows, setRows] = useState(() => {
    if (!value.length) {
      return sourceActions.map(a => ({ action: a.action, level: '', trigger: '', status: '' }));
    }
    // Merge: keep existing configured rows, append any new boundary actions not yet present
    const existingActions = new Set(value.map(r => r.action));
    const newRows = sourceActions
      .filter(a => !existingActions.has(a.action))
      .map(a => ({ action: a.action, level: '', trigger: '', status: '' }));
    return [...value, ...newRows];
  });
  const cleanRows = rows.filter(r => r.action.trim() && r.level);
  const canSave = cleanRows.length >= 1;

  return (
    <EditorShell marker="P-02" edition="Edition 3 — Oversight That Doesn't Become a Bottleneck" title="Oversight Trigger Matrix"
      subtitle="Reflexive oversight on everything creates a bottleneck. Calibrated oversight on the right actions, at the right triggers, holds under scrutiny."
      onSave={() => onSave(cleanRows)} onClose={onClose} saveDisabled={!canSave}>
      <div className="flex items-baseline gap-2 mb-4"><h3 className="display text-2xl">Per-action oversight</h3><ObligationTag>ART. 14 — HUMAN OVERSIGHT</ObligationTag></div>
      <p className="text-sm text-[var(--muted)] italic mb-6">Each allowed or conditional action from the Boundary Contract carries an oversight level and an entry condition.</p>

      {sourceActions.length === 0 && (
        <div className="paper-edge p-6 mb-6" style={{borderColor: 'var(--gap)', background: 'var(--gap-soft)'}}>
          <div className="mono text-xs mb-2" style={{color: 'var(--gap)'}}>UPSTREAM GAP</div>
          <p className="text-sm">Complete the Decision Boundary Contract first — actions defined there populate this matrix automatically.</p>
        </div>
      )}

      <div className="space-y-3">
        {rows.map((row, i) => (
          <div key={i} className="paper-edge p-4">
            <div className="flex items-center gap-2 mb-3">
              <span className="mono text-xs text-[var(--muted)] w-6">{String(i+1).padStart(2,'0')}</span>
              <span className="mono text-[10px] text-[var(--muted)]">OVERSIGHT ROW</span>
              <button onClick={() => setRows(rows.filter((_, idx) => idx !== i))} className="ml-auto text-[var(--muted)] hover:text-[var(--gap)] mono text-xs">×</button>
            </div>
            <input className="field-input mb-3" placeholder="Action"
              value={row.action} onChange={e => { const next = [...rows]; next[i] = {...next[i], action: e.target.value}; setRows(next); }} />
            <div className="grid grid-cols-4 gap-1 mb-3">
              {AUTONOMY_LEVELS.map(l => (
                <button key={l.id} onClick={() => { const next = [...rows]; next[i] = {...next[i], level: l.id}; setRows(next); }}
                  className={`p-2 text-xs border transition-colors ${row.level === l.id ? 'border-[var(--ink)] bg-[var(--accent-soft)]' : 'border-[var(--border-strong)] hover:border-[var(--ink)]'}`}>
                  {l.label}
                </button>
              ))}
            </div>
            <input className="field-input" placeholder="Trigger / entry condition — e.g. Confidence < 0.7, or any flagged sanctions hit"
              value={row.trigger} onChange={e => { const next = [...rows]; next[i] = {...next[i], trigger: e.target.value}; setRows(next); }} />
            {isRetrofit && (
              <div className="mt-3 flex items-center gap-3">
                <span className="text-[10px] mono uppercase text-[var(--muted)]">Production status:</span>
                <StatusSelector value={row.status} onChange={v => { const next = [...rows]; next[i] = {...next[i], status: v}; setRows(next); }} />
              </div>
            )}
          </div>
        ))}
        <button onClick={() => setRows([...rows, { action: '', level: '', trigger: '', status: '' }])} className="text-xs text-[var(--muted)] hover:text-[var(--ink)] underline mt-2">+ Add custom oversight row</button>
      </div>
    </EditorShell>
  );
}

// ============================================================================
// SEQUENCE GENERATOR
// ============================================================================
function generateSequence({ agent, maturity, boundary, oversight, accountability, audit, isRetrofit }) {
  const horizon = parseInt(agent.horizon);
  const weak = maturity?.weakest || [];

  if (isRetrofit) {
    // Retrofit: prioritized gap-closure
    const days = horizon;
    const p1End = Math.round(days * 0.25);
    const p2End = Math.round(days * 0.60);
    const p3End = days;

    // Surface retrofit-specific findings
    const missingOwners = ['decision','oversight','technical','compliance'].filter(r => accountability[r].status === 'missing');
    const missingBoundary = [...(boundary.allowed||[]), ...(boundary.prohibited||[]), ...(boundary.conditional||[])].filter(b => b.status === 'missing').length;
    const missingOversight = oversight.filter(o => o.status === 'missing').length;
    const missingAudit = (audit.fields || []).filter(f => (audit.fieldStatus?.[f] === 'missing')).length;

    return [
      { unit: `Days 1–${p1End}`, title: 'P1 · Immediate exposure closure', items: [
        agent.highRiskFlag === 'yes' ? `High-risk system: accelerate all P1 items — Aug 2026 enforcement risk is concrete` : `Risk class: ${agent.highRiskFlag === 'unclear' ? 'resolve classification first' : 'standard remediation pace'}`,
        missingOwners.length ? `⚠ ${missingOwners.length} accountability role${missingOwners.length>1?'s':''} undocumented — name owners this week (Art. 26(2))` : 'All four owners are documented',
        missingOversight ? `⚠ ${missingOversight} oversight rows marked Missing — establish minimum oversight on high-risk actions` : 'Oversight coverage in place',
        agent.highRiskFlag === 'unclear' ? '⚠ Classification rationale unresolved — write the note this period or pause deployment' : 'Classification rationale stands',
      ]},
      { unit: `Days ${p1End+1}–${p2End}`, title: 'P2 · Structural remediation', items: [
        missingBoundary ? `${missingBoundary} boundary items not enforced in production — code/config remediation` : 'Boundary contract matches production',
        missingAudit ? `${missingAudit} audit fields not logged — instrument and backfill where possible` : 'Audit coverage matches schema',
        weak.includes('Decision Boundary Contract') ? '⚠ Boundary clarity flagged in maturity check — schedule review' : 'Re-test boundary against current deployment',
        weak.includes('Oversight Trigger Matrix') ? '⚠ Oversight maturity weak — calibrate triggers against incident history' : 'Replay 30 days of decisions through new oversight rules',
        `Retention configured to ${audit.retentionMonths} months${agent.highRiskFlag === 'yes' && audit.retentionMonths < 60 ? ' — verify FS minimum (5–7 yrs)' : ''}`,
      ]},
      { unit: `Days ${p2End+1}–${p3End}`, title: 'P3 · Documentation & closure', items: [
        'All four owners sign the Accountability Canvas as currently configured',
        'Profile filed with internal AI Register with retrofit date stamped',
        'Quarterly review cadence agreed for ongoing drift',
        agent.highRiskFlag === 'yes' ? 'Annex IV documentation pack assembled for conformity assessment file' : 'Internal documentation pack filed',
        'Go / continue / pause decision recorded with Compliance Owner signature',
      ]},
    ];
  }

  // Greenfield (pre / inflight): six phases scaled to horizon
  const phaseShare = [0.15, 0.20, 0.20, 0.15, 0.15, 0.15]; // sums to 1
  const cum = phaseShare.reduce((acc, s, i) => [...acc, (acc[i-1] || 0) + s], []);
  const weekMark = i => Math.max(1, Math.round(cum[i] * horizon));
  const weekStart = i => i === 0 ? 1 : weekMark(i-1) + 1;

  const phases = [
    { title: 'Foundation', items: [
      `Agent definition stamped: ${agent.name}`,
      `Written classification rationale finalised (current: ${agent.highRiskFlag})`,
      weak.includes('Agent Definition') ? '⚠ Re-examine intended purpose — flagged weak in maturity check' : 'Stakeholder review of Annex III mapping',
    ]},
    { title: 'Boundary Contract', items: [
      `Boundary Contract reviewed by Technical Owner${accountability.technical.name ? ` (${accountability.technical.name})` : ''}`,
      `${boundary.allowed.length} allowed, ${boundary.prohibited.length} prohibited, ${boundary.conditional.length} conditional actions ratified`,
      'Machine-readable schema generated from contract',
      weak.includes('Decision Boundary Contract') ? '⚠ Boundary clarity flagged — full review session before sign-off' : 'Edge cases stress-tested with sample inputs',
    ]},
    { title: 'Oversight Trigger Matrix', items: [
      `${oversight.length} oversight rows wired to monitoring`,
      'Escalation routes tested end-to-end',
      weak.includes('Oversight Trigger Matrix') ? '⚠ Oversight maturity weak — recommend tabletop exercise' : 'Oversight Owner trained on Trigger Matrix',
    ]},
    { title: 'Accountability Sign-off', items: [
      `Decision Owner: ${accountability.decision.name || '⚠ MISSING'}`,
      `Oversight Owner: ${accountability.oversight.name || '⚠ MISSING'}`,
      `Technical Owner: ${accountability.technical.name || '⚠ MISSING'}`,
      `Compliance Owner: ${accountability.compliance.name || '⚠ MISSING'}`,
      'Accountability Canvas signed off — copy filed with governance record',
    ]},
    { title: 'Audit Schema Live', items: [
      `${audit.fields.length} receipt fields instrumented`,
      `Retention configured: ${audit.retentionMonths} months`,
      weak.includes('Audit Schema') ? '⚠ Audit maturity weak — verify log queryability' : 'Sample receipts validated against incident-reconstruction test',
      'Receipts queryable by Compliance Owner without engineering support',
    ]},
    { title: 'Pre-Deployment Sign-off', items: [
      'End-to-end dry run with all four owners present',
      'Pre-Deployment Governance Checklist signed (Edition 1)',
      'Profile filed with internal AI Register',
      'Go / no-go decision recorded with date and owner signatures',
    ]},
  ];

  // For very short horizons (≤4 weeks), compress to 3 phases
  if (horizon <= 4) {
    return [
      { unit: `Week 1`, title: 'Foundation & contract', items: [...phases[0].items, ...phases[1].items] },
      { unit: `Week ${Math.max(2, Math.round(horizon/2))}`, title: 'Oversight & accountability', items: [...phases[2].items, ...phases[3].items] },
      { unit: `Week ${horizon}`, title: 'Audit & sign-off', items: [...phases[4].items, ...phases[5].items] },
    ];
  }

  return phases.map((p, i) => ({
    unit: weekStart(i) === weekMark(i) ? `Week ${weekStart(i)}` : `Weeks ${weekStart(i)}–${weekMark(i)}`,
    title: p.title,
    items: p.items,
  }));
}

// ============================================================================
// GAPS COMPUTATION
// ============================================================================
function computeGaps({ agent, maturity, boundary, oversight, accountability, audit, isRetrofit }) {
  const g = [];

  // Universal gaps (apply in all modes)
  if (!agent.purposeDetail) g.push({ severity: 'P3', area: 'Definition', obligation: 'Annex IV §1', description: 'Intended purpose (long form) not recorded', status: 'Documentation', owner: 'Compliance', targetDays: 14 });
  if (!agent.systems) g.push({ severity: 'P3', area: 'Definition', obligation: 'Annex IV §1(b)', description: 'Systems and data touched not specified', status: 'Documentation', owner: 'Technical', targetDays: 14 });
  if (agent.highRiskFlag === 'unclear') g.push({ severity: 'P1', area: 'Definition', obligation: 'Art. 6 · Annex III', description: 'Annex III classification marked unclear — must be resolved before deployment', status: 'Missing', owner: 'Compliance', targetDays: 7 });
  if (boundary.conditional.length === 0) g.push({ severity: 'P4', area: 'Boundary', obligation: 'Art. 26(1)', description: 'No conditional actions defined — verify intentional', status: 'Documentation', owner: 'Technical', targetDays: 30 });
  if (audit.fields.length < 5) g.push({ severity: 'P3', area: 'Audit', obligation: 'Art. 12', description: `Only ${audit.fields.length} audit fields selected — verify sufficient for incident reconstruction`, status: 'Partial', owner: 'Technical', targetDays: 30 });
  if (audit.retentionMonths < 60 && agent.highRiskFlag === 'yes') g.push({ severity: 'P2', area: 'Audit', obligation: 'Art. 26(6)', description: `Retention set to ${audit.retentionMonths} months — high-risk FS deployments typically require 60–84 months`, status: 'Partial', owner: 'Compliance', targetDays: 21 });
  if (!maturity) g.push({ severity: 'P4', area: 'Definition', obligation: '—', description: 'Maturity triage not completed', status: 'Documentation', owner: 'Compliance', targetDays: 30 });

  if (isRetrofit) {
    // Boundary items
    [...(boundary.allowed||[]), ...(boundary.prohibited||[])].forEach(b => {
      if (b.status === 'missing') g.push({ severity: 'P2', area: 'Boundary', obligation: 'Art. 26(1)', description: `Boundary not enforced in production: "${b.text}"`, status: 'Missing', owner: 'Technical', targetDays: 30 });
      else if (b.status === 'partial') g.push({ severity: 'P3', area: 'Boundary', obligation: 'Art. 26(1)', description: `Partial boundary enforcement: "${b.text}"`, status: 'Partial', owner: 'Technical', targetDays: 45 });
    });
    (boundary.conditional||[]).forEach(c => {
      if (c.status === 'missing') g.push({ severity: 'P2', area: 'Boundary', obligation: 'Art. 26(1)', description: `Conditional not enforced: "${c.action}"`, status: 'Missing', owner: 'Technical', targetDays: 30 });
    });
    // Oversight rows
    oversight.forEach(o => {
      if (o.status === 'missing') g.push({ severity: 'P1', area: 'Oversight', obligation: 'Art. 14 · Art. 26(2)', description: `No oversight on action: "${o.action}"`, status: 'Missing', owner: 'Oversight', targetDays: 7 });
      else if (o.status === 'partial') g.push({ severity: 'P2', area: 'Oversight', obligation: 'Art. 14', description: `Partial oversight on action: "${o.action}"`, status: 'Partial', owner: 'Oversight', targetDays: 21 });
    });
    // Accountability
    [['decision','Decision'],['oversight','Oversight'],['technical','Technical'],['compliance','Compliance']].forEach(([k, lbl]) => {
      const r = accountability[k];
      if (r.status === 'missing') g.push({ severity: 'P1', area: 'Accountability', obligation: 'Art. 26(2)', description: `${lbl} Owner not documented (${r.name})`, status: 'Missing', owner: lbl, targetDays: 7 });
      else if (r.status === 'partial') g.push({ severity: 'P3', area: 'Accountability', obligation: 'Art. 26(2)', description: `${lbl} Owner role only partially documented (${r.name})`, status: 'Partial', owner: lbl, targetDays: 21 });
    });
    // Audit fields
    (audit.fields || []).forEach(f => {
      const s = audit.fieldStatus?.[f];
      if (s === 'missing') g.push({ severity: 'P2', area: 'Audit', obligation: 'Art. 12 · Art. 26(6)', description: `Audit field not logged in production: "${f}"`, status: 'Missing', owner: 'Technical', targetDays: 30 });
      else if (s === 'partial') g.push({ severity: 'P3', area: 'Audit', obligation: 'Art. 12', description: `Audit field partially logged: "${f}"`, status: 'Partial', owner: 'Technical', targetDays: 45 });
    });
  }

  // Sort by severity
  const sev = { P1: 1, P2: 2, P3: 3, P4: 4 };
  return g.sort((a, b) => sev[a.severity] - sev[b.severity]);
}

// ============================================================================
// CSV EXPORT
// ============================================================================
function downloadGapRegister(agent, gaps) {
  if (!gaps.length) return;
  const rows = gaps.map((g, i) => ({
    gap_id: `GAP-${String(i+1).padStart(3, '0')}`,
    severity: g.severity,
    area: g.area,
    obligation: g.obligation,
    description: g.description,
    status: g.status,
    suggested_owner: g.owner,
    target_close_days: g.targetDays,
  }));
  const headers = Object.keys(rows[0]).join(',');
  const csv = headers + '\n' + rows.map(r =>
    Object.values(r).map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
  ).join('\n');

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(agent.name || 'agent').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-gap-register.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
